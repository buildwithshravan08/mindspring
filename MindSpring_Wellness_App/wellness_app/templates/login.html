{% extends 'base.html' %}
{% block title %}Log In | {{ app_name }}{% endblock %}

{% block content %}
<div class="form-card narrow">
  <span class="pill-badge">Welcome Back</span>
  <h1 class="mb-2">Log in to your sanctuary 🌿</h1>
  <p class="lead-text mb-4">Continue your mindful habits and view your progress.</p>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3">
      <label class="form-label fw-bold">Email Address</label>
      <input type="email" name="email" class="form-control form-control-lg" placeholder="student@college.edu" required>
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold">Password</label>
      <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
    </div>

    <button class="btn btn-custom-primary btn-lg w-100" type="submit">
      Log In →
    </button>
  </form>

  <div class="text-center mt-4 pt-3 border-top">
    <p class="small text-muted mb-0">
      New to {{ app_name }}? <a href="{{ url_for('signup') }}" class="fw-bold text-primary-dark">Create an account in 1 minute</a>.
    </p>
  </div>
</div>
{% endblock %}
